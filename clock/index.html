<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reloj</title>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    html, body {
      margin: 0;
      height: 100%;
    }
    body {
      font-family: 'Quicksand', sans-serif;
      background: transparent;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: color 0.3s ease, background 0.3s ease;
      color: #000000; /* por defecto claro */
    }
    body.dark {
      color: #ffffff;
    }
    #clock {
      font-size: 15vw; /* escala con el ancho de la ventana */
      line-height: 1;
      font-weight: 700;
      letter-spacing: 0.02em;
      margin-bottom: 5vh;
      text-align: center;
      word-wrap: break-word;
    }
    .switch {
      width: 8vw;
      height: 8vw;
      max-width: 70px;
      max-height: 70px;
      min-width: 40px;
      min-height: 40px;
      border-radius: 50%;
      border: none;
      background: #ccc;
      cursor: pointer;
      transition: background 0.3s ease;
    }
    body.dark .switch {
      background: #555;
    }
  </style>
</head>
<body>
  <div id="clock">00:00</div>
  <button class="switch" id="toggleMode"></button>

  <script>
    function pad(n) { return n.toString().padStart(2, '0'); }
    function update() {
      const now = new Date();
      const hours = now.getHours();
      const minutes = now.getMinutes();
      document.getElementById('clock').textContent = `${pad(hours)}:${pad(minutes)}`;
    }
    update();
    setInterval(update, 1000);

    const toggle = document.getElementById('toggleMode');

    // Detectar modo del sistema
    const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    if (prefersDark) {
      document.body.classList.add('dark');
    }

    // Cambiar manualmente
    toggle.addEventListener('click', () => {
      document.body.classList.toggle('dark');
    });
  </script>
</body>
</html>
