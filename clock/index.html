<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reloj</title>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    html, body {
      margin: 0;
      height: 100%;
    }
    body {
      font-family: 'Quicksand', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding-left: 2%;
      padding-right: 2%;
      transition: color 0.3s ease, background 0.3s ease;
      color: #000000; /* texto modo claro */
      background: #ffffff; /* fondo modo claro */
    }
    @media (prefers-color-scheme: dark) {
      body {
        color: #ffffff; /* texto modo oscuro */
        background: #000000; /* fondo modo oscuro */
      }
    }
    #clock {
      font-size: 15vw; /* escala con el ancho de la ventana */
      line-height: 1;
      font-weight: 700;
      letter-spacing: 0.02em;
      text-align: center;
      word-wrap: break-word;
      width: 100%;
    }
  </style>
</head>
<body>
  <div id="clock">00:00</div>

  <script>
    function pad(n) { return n.toString().padStart(2, '0'); }
    function update() {
      const now = new Date();
      const hours = now.getHours();
      const minutes = now.getMinutes();
      document.getElementById('clock').textContent = `${pad(hours)}:${pad(minutes)}`;
    }
    update();
    setInterval(update, 1000);
  </script>
</body>
</html>
